<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅行的記憶</title>
<link rel="stylesheet" href="style.css?v=world-map-title">
<script src="card-art.js?v=individual-cards" defer></script><script src="game.js?v=music-default" defer></script>
</head>
<body>
<div class="scenery" aria-hidden="true"><div class="scene-art"><div class="thai-market" aria-hidden="true"></div></div><div id="scene-effects"></div><div class="sun"></div><div class="hill hill-one"></div><div class="hill hill-two"></div><div class="landmark" id="landmark"></div></div>
<main>
<header><span class="brand">✦ 旅行的記憶</span><button id="music" type="button" aria-pressed="true">♫ 音樂開啟</button></header>
<nav id="route" aria-label="旅行路線"></nav>
<section id="intro" class="ticket">
<div id="suitcase" class="suitcase" role="img" aria-label="行李箱內的七站島嶼地圖"></div><div id="arrival" class="arrival"><div class="postcard" aria-hidden="true"><div class="scene-art"><div class="thai-market" aria-hidden="true"></div></div></div><p class="eyebrow" id="eyebrow"></p>
<h1 id="title"></h1>
<p id="description"></p>
<button id="start" class="primary"></button>
</div>
</section>
<section id="play" hidden aria-label="翻牌遊戲">
<div class="dashboard"><h1 id="destination"></h1><span id="pairs"></span><span id="timer" role="timer"></span></div>
<div id="board" class="board" aria-label="卡片區"></div>
<p id="feedback" role="status"></p>
</section>
</main>
</body>
</html>
